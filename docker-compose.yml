version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: seo_vision_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: seo-vision
    volumes:
      - mongo_data:/data/db

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seo_vision_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/seo-vision
      - JWT_SECRET=seo_vision_secret_jwt_key_mca_2026_secure
      - NODE_ENV=production
    depends_on:
      - mongodb

volumes:
  mongo_data:
