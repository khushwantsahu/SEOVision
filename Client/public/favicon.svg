<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="seoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#seoGradient)" />

  <!-- Bar Chart 1 (Left - Lowest) -->
  <rect x="14" y="34" width="8" height="16" rx="4" fill="#ffffff" fill-opacity="0.9" />

  <!-- Bar Chart 2 (Center - Medium) -->
  <rect x="28" y="24" width="8" height="26" rx="4" fill="#ffffff" />

  <!-- Bar Chart 3 (Right - Highest) -->
  <rect x="42" y="14" width="8" height="36" rx="4" fill="#ffffff" />

  <!-- Vision / Growth spark dot -->
  <circle cx="46" cy="18" r="1.5" fill="#60a5fa" />
</svg>
